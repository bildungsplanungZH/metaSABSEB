  datensatz: qm_sekII
  oberthema: Prozess
  unterthema: Unterricht
  umfrage_item: Wie viel können Sie selber aktiv sein im Unterricht?
  itemformulierung: Wir werden oft aufgefordert, unser Wissen auf aktuelle Ereignisse
    und alltägliche Situationen anzuwenden.
  var_typ: 'Skala: Selbstaktivität'
  umfrage_filter: school_type_id = 1, 4, 5
  skalen_berechnung: Mean, Ausschluss wenn Missings >2
  quelle: Mittelschulerhebung 2004 (Leutwyler & Maag Merki, 2004. Indikatoren zu Kontextmerkmalen
    gymnasialer Bildung. Perspektive der Schülerinnen und Schüler. Skalen- und Itemdokumentation.),
    Selbstaktivität (2 von 4 Items), Elaboration (2 von 5 Items)
  status: aktiv
  values:
    '1': trifft überhaupt nicht zu
    '2': .na.character
    '3': .na.character
    '4': .na.character
    '5': .na.character
    '6': trifft voll und ganz zu
