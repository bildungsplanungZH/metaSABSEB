Zukunft:
  datensatz: qm_sekII
  oberthema: Output/Outcome
  unterthema: Wert für die Zukunft
  umfrage_item: Haben Sie sich schon endgültig entschieden, was Sie nach Abschluss
    Ihrer Ausbildung machen?
  itemformulierung: 'Bitte geben Sie Ihre längerfristige Planung an, eine allfällige
    Zwischenphase wie Militär, Reisen, Sprachaufenthalt, Zwischenjahr oder eine Pause
    usw. ist hier nicht gemeint. Achtung: Nur eine Antwort möglich.'
  var_typ: 'Einzelitem: Zukunftspläne'
  quelle: Eigenkonstruktion des IVM
  status: aktiv
  values:
    '1': Ja, Studium an der Universität oder ETH
    '2': Ja, feste Anstellung ohne weiter Ausbildung (arbeiten, für mehr als ein Jahr,
      keine Zwischenlösung)
    '3': Ja, Ausbildung an einer Pädagogischen Hochschule
    '4': Ja, Ausbildung an einer Fachhochschule (ohne Pädagogische Hochschule)
    '5': Ja, interne Weiterbildung im Betrieb
    '6': Ja, berufliche Grundbildung (Lehre)
    '7': Ja, Berufsmaturität (berufsbegleitend oder Vollzeit)
    '8': Ja, Fachmaturität
    '9': Ja, gymnasiale Matur (inkl. Erwachsenenmatur)
    '10': Ja, Studium an einer Höheren Fachschule
    '11': Ja, Vorbereitungskurs für die Pädagogische Hochschule
    '12': Ja, Vorbereitungskurs/Propädeutikum für die Schule für Gestaltung
    '13': Ja, Passerelle Berufsmaturität – universitäre Hochschule
    '14': Ja, arbeiten mit weiterer Teilzeitausbildung (inkl. Interne Ausbildung in
      einem Betrieb / ohne berufsbegleitende Berufsmatura)
    '15': Ja, etwas anderes
    '16': Nein, ich weiss noch nicht genau, was ich tun werde
