  oberthema: Output/Outcome
  unterthema: Überfachliche Kompetenzen
  umfrage_item: Wie beurteilen Sie Ihre methodischen Kompetenzen?
  itemformulierung: Ich setze mir beim Lernen eigene Ziele.
  var_typ: 'Skala: Selbsteinschätzung der methodischen Kompetenzen'
  umfrage_filter: school_type_id = 1, 4, 5
  skalen_berechnung: Mean, Ausschluss wenn Missings >3
  quelle: 1) SEIS - Selbstevaluation in Schulen, 2) Fragebogen zur Einschätzung überfachlicher
    Kompetenzen (Helm et al., 2012), 3) SEB, IVM
  status: aktiv
  values:
    '1': trifft überhaupt nicht zu
    '2': .na.character
    '3': .na.character
    '4': .na.character
    '5': .na.character
    '6': trifft voll und ganz zu
Mk_ziel_a:
  datensatz: qm_sekII
  oberthema: Output/Outcome
  unterthema: Überfachliche Kompetenzen
  umfrage_item: Haben Sie in der Zeit an Ihrer Schule in folgenden Bereichen dazu
    gelernt? Ich habe an der Schule gelernt, ...
  itemformulierung: '... mir Ziele zu setzen, die ich erreichen kann.'
  var_typ: 'Skala: Selbsteinschätzung des Zuwachses der methodischen Kompetenzen'
  umfrage_filter: school_type_id = 3, 8, 9
  skalen_berechnung: Mean, Ausschluss wenn Missings >2
  quelle: 1) SEIS - Selbstevaluation in Schulen, 2) Fragebogen zur Einschätzung überfachlicher
    Kompetenzen (Helm et al., 2012), 3) SEB, IVM, 4) Eigenkonstruktion IFES IPES
  status: aktiv
  values:
    '1': trifft überhaupt nicht zu
    '2': .na.character
    '3': .na.character
    '4': .na.character
    '5': .na.character
    '6': trifft voll und ganz zu
Mot_beg:
  datensatz: qm_sekII
  oberthema: Input
  unterthema: Lehrpersonenexpertise
  umfrage_item: Werden Sie von Ihren Lehrpersonen beim Lernen unterstützt?
  itemformulierung: Unsere Lehrpersonen können uns Schülerinnen und Schüler manchmal
    richtig begeistern.
  var_typ: 'Skala: Motivation durch die Lehrperson'
  umfrage_filter: school_type_id = 1, 4, 5
  skalen_berechnung: Mean, Ausschluss wenn Missings >1
  quelle: 'BIJU (Baumert et al., 1997. Indikatoren zu Kontextmerkmalen gymnasialer
    Bildung. Perspektive der Schülerinnen und Schüler. Skalen- und Itemdokumentation),
    Mittelschulerhebung 2004 (Leutwyler & Maag Merki, 2004. Indikatoren zu Kontextmerkmalen
    gymnasialer Bildung. Perspektive der Schülerinnen und Schüler. Skalen- und Itemdokumentation),
    Pythagoras Projekt (Klieme, Pauli, Reusser, 2005; Rakoczy, Katrin, Buff, Alex
    & Lipowsky, Frank. (2005). Befragungsinstrumente. In: E. Klieme, C. Pauli & K.
    Reusser, Dokumentation der Erhebungs- und Auswertungsintrumente zur schweizerisch-deutschen
    Videostudie „Unterrichtsqualität, Lernverhalten und mathematisches Verständnis)'
  status: aktiv
  values:
    '1': keine Lehrpersonen
    '2': .na.character
    '3': .na.character
    '4': .na.character
    '5': .na.character
    '6': alle Lehrpersonen
