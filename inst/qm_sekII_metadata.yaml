  oberthema: Werdegang
  umfrage_item: Was ist zurzeit Ihre Haupttätigkeit?,
  var_typ: 'Einzelitem: Momentane Haupttätigkeit'
  quelle: Bildungssystem Schweiz
  status: aktiv
  values:
    '1': Ich studiere an einer Universität oder der ETH / EPFL
    '2': Ich bin erwerbstätig (aber nicht in Ausbildung oder Praktikum
    '3': Ich absolviere die BMS
    '4': Ich mache die Fachmatura
    '5': Ich mache die gymnasiale Matura
    '6': Ich mache die Passerelle Berufsmaturität - universitäre Hochschule
    '7': Ich absolviere einen Vorkurs für die Pädagogische Hochschule.
    '8': Ich studiere an einer Pädagogischen Hochschule.
    '9': Ich studiere an einer Fachhochschule (ohne Pädagogische Hochschule).
    '10': Ich absolviere eine höhere Fachausbildung bzw. besuche eine höhere Fachschule.
    '11': Ich absolviere einen Vorkurs / ein Propädeutikum für eine gestalterische
      Hochschule
    '12': Ich bin in einer beruflichen Grundbildung (Lehre).
    '13': Ich bin in einer firmeninternen Ausbildung.
    '14': Ich absolviere ein Praktikum.
    '15': Ich leiste Militär- bzw. Zivildienst.
    '16': Ich bin arbeitslos.
    '17': Sonstiges
