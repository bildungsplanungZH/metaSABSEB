Stoer_andere:
  datensatz: qm_sekII
  oberthema: Prozess
  unterthema: Unterricht
  umfrage_item: Wie erleben Sie das Klima in Ihrer Klasse?
  itemformulierung: Manche Schülerinnen und Schüler beschäftigen sich häufig mit anderen
    Dingen, ohne sich viel um den Unterricht zu kümmern.
  var_typ: 'Skala: Störungen im Unterricht'
  umfrage_filter: school_type_id = 1
  skalen_berechnung: Mean, Ausschluss wenn Missings >2
  quelle: 'Mittelschulerhebung 2004 (Leutwyler & Maag Merki, 2004. Indikatoren zu
    Kontextmerkmalen gymnasialer Bildung. Perspektive der Schülerinnen und Schüler.
    Skalen- und Itemdokumentation) (4 von 6 Items), basierend auf BIJU (Baumert et
    al., 1997. Bildungsverläufe und psychosoziale Entwicklung im Jugendalter (BIJU).
    Dokumentation (Band 1: Skalen Längsschnitt I, Welle 1-4).) und Linzer Fragebogen
    zum Schul- und Klassenklima (Eder, 1998. Linzer Fragebogen zum Schul- und Klassenklima
    für die 8.-13. Klasse (LFSK 8-13))'
  status: Aktiv
  values:
    '1': trifft überhaupt nicht zu
    '2': .na.character
    '3': .na.character
    '4': .na.character
    '5': .na.character
    '6': trifft voll und ganz zu
